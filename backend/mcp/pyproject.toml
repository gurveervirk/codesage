[project]
name = "codesage-library-explorer"
version = "0.1.0"
description = "MCP server for exploring CodeSage library knowledge graph"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp==1.4.1",
    "python-dotenv>=1.0.0",
    "neo4j>=5.0.0",
    "llama-index-graph-stores-neo4j>=0.2.0",
    "llama-index-core>=0.10.0"
]

[project.optional-dependencies]
dev = ["debugpy==1.8.8"]