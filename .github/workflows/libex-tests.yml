name: LibEx Tests

on:
  push:
    branches:
      - '**'
    paths:
      - 'backend/lib_sage/libex/**'
      - 'backend/tests/libex/**'
      - '.github/workflows/libex-tests.yml'
  pull_request:
    branches:
      - '**'
    paths:
      - 'backend/lib_sage/libex/**'
      - 'backend/tests/libex/**'

jobs:
  libex-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python 3.13.5
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      
      - name: Install dependencies
        run: |
          uv pip install -r backend/tests/requirements.txt --system
      
      - name: Check for expected outputs
        id: check-outputs
        run: |
          cd backend/tests/libex
          if [ -d "expected_outputs" ] && [ "$(ls -A expected_outputs)" ]; then
            echo "has_outputs=true" >> $GITHUB_OUTPUT
            echo "✅ Expected outputs found"
          else
            echo "has_outputs=false" >> $GITHUB_OUTPUT
            echo "❌ ERROR: No expected outputs found!"
            echo ""
            echo "Expected outputs are required to run libex tests."
            echo "Please generate them by running:"
            echo ""
            echo "  cd backend/tests/libex"
            echo "  python prepare_tests.py"
            echo "  git add expected_outputs/"
            echo "  git commit -m 'Add expected outputs for libex tests'"
            echo ""
          fi
      
      - name: Fail if no expected outputs
        if: steps.check-outputs.outputs.has_outputs == 'false'
        run: exit 1
      
      - name: Run libex tests
        if: steps.check-outputs.outputs.has_outputs == 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          cd backend/tests/libex
          pytest test_libex_outputs.py -v --tb=long --junit-xml=../../test-results-libex.xml
      
      - name: Generate debug outputs on failure
        if: failure()
        continue-on-error: true
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          cd backend/tests/libex
          echo "Generating fresh outputs for debugging..."
          python prepare_tests.py --override 2>&1 | tee prepare_debug.log
      
      - name: Upload test results and debug info
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libex-test-results-python-3.13.5
          path: |
            backend/tests/libex/expected_outputs/
            backend/tests/libex/test_jsons/
            backend/tests/libex/prepare_debug.log
            backend/test-results-libex.xml
          retention-days: 30
