name: PR Checks

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      
      - name: Install dependencies
        run: |
          cd backend
          uv pip install -e ".[dev]" --system
      
      - name: Check Python formatting (ruff)
        run: |
          cd backend
          ruff check . || echo "⚠️  Ruff check found issues"
        continue-on-error: true
      
      - name: Validate libex test JSONs
        run: |
          cd backend/tests/libex
          for file in test_jsons/*.json; do
            if [ -f "$file" ]; then
              python -c "import json; json.load(open('$file'))" || {
                echo "❌ Invalid JSON: $file"
                exit 1
              }
            fi
          done
          echo "✅ All test JSONs are valid"
      
      - name: Check for expected outputs
        run: |
          cd backend/tests/libex
          if [ ! -d "expected_outputs" ] || [ -z "$(ls -A expected_outputs 2>/dev/null)" ]; then
            echo "❌ ERROR: No expected outputs found for libex tests!"
            echo ""
            echo "Expected outputs are required to run tests."
            echo "Please generate them by running:"
            echo ""
            echo "  cd backend/tests/libex"
            echo "  python prepare_tests.py"
            echo "  git add expected_outputs/"
            echo "  git commit -m 'Add expected outputs for libex tests'"
            echo ""
            exit 1
          else
            echo "✅ Expected outputs present"
          fi

  test-quick:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      
      - name: Install dependencies
        run: |
          cd backend
          uv pip install -e ".[dev]" --system
      
      - name: Quick libex test run
        run: |
          cd backend/tests/libex
          pytest test_libex_outputs.py -v --maxfail=3 --tb=short
      
      - name: Comment PR
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ Tests failed! Please check the Actions tab for details.'
            })
