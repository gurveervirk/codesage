name: Run Tests

on:
  push:
    branches:
      - '**'  # Run on all branches
  pull_request:
    branches:
      - '**'  # Run on all PRs

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python 3.13.5
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      
      - name: Create virtual environment and install dependencies
        run: |
          cd backend/tests
          uv venv .venv
          uv pip install -r requirements.txt
      
      - name: Check for expected outputs
        run: |
          cd backend/tests/libex
          if [ ! -d "expected_outputs" ] || [ -z "$(ls -A expected_outputs 2>/dev/null)" ]; then
            echo "❌ ERROR: No expected outputs found!"
            echo ""
            echo "Expected outputs are required to run libex tests."
            echo "Please generate them by running:"
            echo ""
            echo "  cd backend/tests/libex"
            echo "  python prepare_tests.py"
            echo "  git add expected_outputs/"
            echo "  git commit -m 'Add expected outputs for libex tests'"
            echo ""
            exit 1
          fi
          echo "✅ Expected outputs found"
      
      - name: Run libex tests
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          cd backend/tests/libex
          source ../.venv/bin/activate
          pytest test_libex_outputs.py -v --tb=long
      
      - name: Generate debug outputs on failure
        if: failure()
        continue-on-error: true
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          cd backend/tests/libex
          source ../.venv/bin/activate
          echo "Generating fresh outputs for debugging..."
          python prepare_tests.py 2>&1 | tee prepare_debug.log
      
      - name: Upload test results and debug info
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-python-3.13.5
          path: |
            backend/tests/libex/expected_outputs/
            backend/tests/libex/test_jsons/
            backend/tests/libex/prepare_debug.log
            backend/tests/*.xml
            backend/tests/**/*.xml
          retention-days: 30
